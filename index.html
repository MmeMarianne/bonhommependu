<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Pendu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #17302b;
    --board-deep: #10241f;
    --chalk: #f3efe4;
    --chalk-dim: #a9b8b0;
    --gold: #ecb64d;
    --red: #ef7560;
    --green: #8fd19e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, var(--board) 0%, var(--board-deep) 100%) fixed;
    color: var(--chalk);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    padding: 20px 16px 40px;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 {
    font-family: "Caveat", "Comic Sans MS", cursive;
    font-size: clamp(2.6rem, 8vw, 4rem);
    margin: 0 0 4px;
    text-align: center;
    letter-spacing: 1px;
  }
  .sous-titre { text-align: center; color: var(--chalk-dim); margin: 0 0 20px; }

  .niveaux { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .niveaux button {
    font: inherit; font-weight: 700;
    background: transparent; color: var(--chalk);
    border: 2px solid var(--chalk-dim); border-radius: var(--radius);
    padding: 8px 16px; cursor: pointer;
  }
  .niveaux button small { display: block; font-weight: 400; color: var(--chalk-dim); font-size: .75rem; }
  .niveaux button[aria-pressed="true"] { background: var(--chalk); color: var(--board-deep); border-color: var(--chalk); }
  .niveaux button[aria-pressed="true"] small { color: #3d5a52; }

  .scene { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 24px; align-items: center; }
  @media (max-width: 600px) { .scene { grid-template-columns: 1fr; } }
  svg { width: 100%; max-width: 260px; margin: 0 auto; display: block; }
  svg .trait { stroke: var(--chalk); stroke-width: 5; stroke-linecap: round; fill: none; }
  svg .part { opacity: 0; }
  svg .part.on { opacity: 1; animation: trace .35s ease-out; }
  svg .pendu .trait { stroke: var(--red); }
  @keyframes trace { from { opacity: 0; } to { opacity: 1; } }

  .infos { text-align: center; }
  .vies { color: var(--chalk-dim); margin: 0 0 8px; }
  .vies strong { color: var(--gold); font-size: 1.3rem; }
  .mot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; min-height: 3.4rem; }
  .lettre {
    width: 2.1rem; height: 3rem;
    border-bottom: 4px solid var(--chalk);
    font-family: "Caveat", cursive; font-weight: 700; font-size: 2.6rem; line-height: 3rem;
    text-align: center;
  }
  .lettre.perdue { color: var(--red); }
  .statut { min-height: 3em; font-weight: 700; margin: 8px 0; }
  .statut.gagne { color: var(--green); }
  .statut.perdu { color: var(--red); }
  .erreurs { color: var(--chalk-dim); min-height: 1.6em; font-size: .95rem; }
  .erreurs span { color: var(--red); font-weight: 800; margin: 0 3px; }

  .clavier { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 24px auto 0; max-width: 620px; }
  .clavier button {
    width: 2.7rem; height: 2.7rem;
    font: inherit; font-weight: 800; font-size: 1.05rem;
    color: var(--chalk); background: rgba(243, 239, 228, .08);
    border: 2px solid var(--chalk-dim); border-radius: var(--radius);
    cursor: pointer;
  }
  .clavier button:hover:not(:disabled) { background: rgba(243, 239, 228, .2); }
  .clavier button:disabled { cursor: default; }
  .clavier button.ok { background: var(--green); color: var(--board-deep); border-color: var(--green); }
  .clavier button.ko { background: transparent; color: var(--red); border-color: var(--red); opacity: .55; text-decoration: line-through; }

  .actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 26px; }
  .rejouer {
    font: inherit; font-weight: 800; font-size: 1.05rem;
    background: var(--gold); color: #3a2a05; border: none; border-radius: var(--radius);
    padding: 11px 26px; cursor: pointer;
  }
  .score { color: var(--chalk-dim); font-size: .9rem; }

  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { svg .part.on { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Le Pendu</h1>
  <p class="sous-titre">Devine le mot, lettre par lettre, avant que le dessin ne soit terminé.</p>

  <div class="niveaux" id="niveaux" role="group" aria-label="Niveau de difficulté">
    <button data-niveau="facile" aria-pressed="true">Facile<small>10 erreurs · mots courts</small></button>
    <button data-niveau="moyen" aria-pressed="false">Moyen<small>8 erreurs · mots moyens</small></button>
    <button data-niveau="difficile" aria-pressed="false">Difficile<small>6 erreurs · mots longs</small></button>
  </div>

  <section class="scene">
    <svg viewBox="0 0 260 300" role="img" aria-label="Dessin du pendu" id="dessin">
      <g class="part" data-etape="1"><line class="trait" x1="20" y1="285" x2="150" y2="285"/></g>
      <g class="part" data-etape="2"><line class="trait" x1="60" y1="285" x2="60" y2="25"/></g>
      <g class="part" data-etape="3"><line class="trait" x1="60" y1="25" x2="190" y2="25"/><line class="trait" x1="60" y1="70" x2="105" y2="25"/></g>
      <g class="part" data-etape="4"><line class="trait" x1="190" y1="25" x2="190" y2="60"/></g>
      <g class="pendu">
        <g class="part" data-etape="5"><circle class="trait" cx="190" cy="82" r="22"/></g>
        <g class="part" data-etape="6"><line class="trait" x1="190" y1="104" x2="190" y2="190"/></g>
        <g class="part" data-etape="7"><line class="trait" x1="190" y1="120" x2="160" y2="160"/></g>
        <g class="part" data-etape="8"><line class="trait" x1="190" y1="120" x2="220" y2="160"/></g>
        <g class="part" data-etape="9"><line class="trait" x1="190" y1="190" x2="165" y2="245"/></g>
        <g class="part" data-etape="10"><line class="trait" x1="190" y1="190" x2="215" y2="245"/></g>
      </g>
    </svg>

    <div class="infos">
      <p class="vies">Erreurs permises : <strong id="vies">10</strong></p>
      <div class="mot" id="mot" aria-live="polite"></div>
      <p class="statut" id="statut" aria-live="assertive"></p>
      <p class="erreurs" id="erreurs"></p>
    </div>
  </section>

  <div class="clavier" id="clavier" aria-label="Clavier"></div>

  <div class="actions">
    <button class="rejouer" id="rejouer">Nouveau mot</button>
    <p class="score" id="score"></p>
  </div>
</main>

<script>
(function () {
  "use strict";

  // Nombre d'erreurs permises et listes de mots par niveau.
  // Pour ajouter des mots, ajoutez-les simplement dans les tableaux (accents autorisés).
  var NIVEAUX = {
    facile: {
      erreurs: 10,
      mots: ["chat","chien","pomme","livre","table","arbre","fleur","plage","lune","neige","avion","vélo","ballon","tigre","singe","poule","école","glace","cheval","canard","soupe","train","sable","forêt","étoile","nuage","route","miel","pain","lait","soleil","jardin","bateau","gâteau","lapin","girafe"]
    },
    moyen: {
      erreurs: 8,
      mots: ["montagne","chocolat","fenêtre","horloge","voyageur","éléphant","papillon","hôpital","orchestre","tempête","dentiste","boulanger","escalier","couteau","chameau","cathédrale","poisson","alphabet","mystère","bonheur","rivière","aventure","cuisinier","guitare","lunettes","bouteille","parapluie","hirondelle","fourmilière","champignon"]
    },
    difficile: {
      erreurs: 6,
      mots: ["bibliothèque","kaléidoscope","extraordinaire","hippopotame","philosophie","chrysanthème","métamorphose","labyrinthe","psychologue","onomatopée","rhinocéros","quincaillerie","ambidextre","claustrophobie","archéologue","mélancolie","paradoxal","boulangerie","cauchemardesque","enchevêtrement","mésaventure","xylophone","sarcophage","thermomètre","vocabulaire","kinésithérapeute","ressemblance","orthographe","symphonie","électricité"]
    }
  };
  var ETAPES_MAX = 10;

  var el = {
    niveaux: document.getElementById("niveaux"),
    dessin: document.getElementById("dessin"),
    vies: document.getElementById("vies"),
    mot: document.getElementById("mot"),
    statut: document.getElementById("statut"),
    erreurs: document.getElementById("erreurs"),
    clavier: document.getElementById("clavier"),
    rejouer: document.getElementById("rejouer"),
    score: document.getElementById("score")
  };

  var etat = { niveau: "facile", mot: "", trouvees: [], ratees: [], fini: false };
  var pioches = {};
  var scores = { victoires: 0, defaites: 0 };

  try {
    var sauve = JSON.parse(localStorage.getItem("pendu-scores"));
    if (sauve && typeof sauve.victoires === "number") scores = sauve;
  } catch (e) {}

  function normaliser(s) {
    return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  }

  function melanger(tab) {
    var a = tab.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Tirage sans répétition tant que tous les mots du niveau n'ont pas été joués.
  function tirerMot(niveau) {
    if (!pioches[niveau] || !pioches[niveau].length) pioches[niveau] = melanger(NIVEAUX[niveau].mots);
    return pioches[niveau].pop();
  }

  function etapeDessin() {
    var max = NIVEAUX[etat.niveau].erreurs;
    var n = etat.ratees.length;
    if (n >= max) return ETAPES_MAX;
    return Math.round(n * ETAPES_MAX / max);
  }

  function dessiner() {
    var etape = etapeDessin();
    var parts = el.dessin.querySelectorAll(".part");
    for (var i = 0; i < parts.length; i++) {
      var actif = Number(parts[i].getAttribute("data-etape")) <= etape;
      parts[i].classList.toggle("on", actif);
    }
  }

  function afficher() {
    var max = NIVEAUX[etat.niveau].erreurs;
    el.vies.textContent = max - etat.ratees.length;

    el.mot.innerHTML = "";
    var mot = etat.mot;
    for (var i = 0; i < mot.length; i++) {
      var span = document.createElement("span");
      span.className = "lettre";
      var trouvee = etat.trouvees.indexOf(normaliser(mot[i])) !== -1;
      if (trouvee) span.textContent = mot[i].toUpperCase();
      else if (etat.fini) { span.textContent = mot[i].toUpperCase(); span.classList.add("perdue"); }
      el.mot.appendChild(span);
    }

    el.erreurs.innerHTML = etat.ratees.length
      ? "Lettres ratées : " + etat.ratees.map(function (l) { return "<span>" + l + "</span>"; }).join("")
      : "";

    var touches = el.clavier.querySelectorAll("button");
    for (var k = 0; k < touches.length; k++) {
      var L = touches[k].textContent;
      var ok = etat.trouvees.indexOf(L) !== -1;
      var ko = etat.ratees.indexOf(L) !== -1;
      touches[k].disabled = ok || ko || etat.fini;
      touches[k].className = ok ? "ok" : ko ? "ko" : "";
    }
    dessiner();
    el.score.textContent = "Victoires : " + scores.victoires + " · Défaites : " + scores.defaites;
  }

  function sauverScores() {
    try { localStorage.setItem("pendu-scores", JSON.stringify(scores)); } catch (e) {}
  }

  function motComplet() {
    for (var i = 0; i < etat.mot.length; i++) {
      if (etat.trouvees.indexOf(normaliser(etat.mot[i])) === -1) return false;
    }
    return true;
  }

  function jouer(lettre) {
    if (etat.fini) return;
    if (etat.trouvees.indexOf(lettre) !== -1 || etat.ratees.indexOf(lettre) !== -1) return;

    if (normaliser(etat.mot).indexOf(lettre) !== -1) etat.trouvees.push(lettre);
    else etat.ratees.push(lettre);

    if (motComplet()) {
      etat.fini = true; scores.victoires++; sauverScores();
      el.statut.className = "statut gagne";
      el.statut.textContent = "Bravo, tu as trouvé le mot !";
    } else if (etat.ratees.length >= NIVEAUX[etat.niveau].erreurs) {
      etat.fini = true; scores.defaites++; sauverScores();
      el.statut.className = "statut perdu";
      el.statut.textContent = "Perdu ! Le mot était « " + etat.mot.toUpperCase() + " ».";
    }
    afficher();
    if (etat.fini) el.rejouer.focus();
  }

  function nouvellePartie() {
    etat.mot = tirerMot(etat.niveau);
    etat.trouvees = [];
    etat.ratees = [];
    etat.fini = false;
    el.statut.className = "statut";
    el.statut.textContent = etat.mot.length + " lettres. À toi de jouer !";
    afficher();
  }

  // Clavier à l'écran
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function (L) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = L;
    b.addEventListener("click", function () { jouer(L); });
    el.clavier.appendChild(b);
  });

  // Clavier physique (les lettres accentuées comptent comme leur lettre de base)
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
    var L = normaliser(e.key);
    if (/^[A-Z]$/.test(L)) jouer(L);
  });

  // Choix du niveau
  el.niveaux.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var btns = el.niveaux.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute("aria-pressed", btns[i] === b ? "true" : "false");
    etat.niveau = b.getAttribute("data-niveau");
    nouvellePartie();
  });

  el.rejouer.addEventListener("click", nouvellePartie);
  nouvellePartie();
})();
</script>
</body>
</html>
